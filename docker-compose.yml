name: assessly

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: assessly-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3000
      - CORS_ORIGIN=http://localhost:8080
      - STORAGE_DRIVER=local
      - CLIENT_URL=http://localhost:8080
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - assessly-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: assessly-frontend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - VITE_API_URL=http://localhost:3000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - assessly-network

networks:
  assessly-network:
    driver: bridge
